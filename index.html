<title>Cardlit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: deck rail on the left, one ruled index card centre stage, Leitner box tray beneath it. */
:root {
  --paper: #eef1f4;
  --surface: #ffffff;
  --ink: #1b2433;
  --muted: #5d6878;
  --line: #d5dce5;
  --rule-blue: #a9c0dd;
  --rule-red: #d4473a;
  --accent: #2753a8;
  --accent-ink: #ffffff;
  --again: #c4402f;
  --hard: #b8790f;
  --good: #2f7d4f;
  --easy: #2753a8;
  --shadow: 0 1px 0 rgba(27,36,51,.06), 0 10px 30px -12px rgba(27,36,51,.25);
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-card: "Newsreader", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12161d; --surface: #1b212b; --ink: #e6ebf2; --muted: #97a2b2; --line: #2d3543;
  --rule-blue: #34496a; --rule-red: #e0675a; --accent: #7ea5ec; --accent-ink: #0f1724;
  --again: #e57565; --hard: #e0a945; --good: #5cbf83; --easy: #7ea5ec;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #12161d; --surface: #1b212b; --ink: #e6ebf2; --muted: #97a2b2; --line: #2d3543;
  --rule-blue: #34496a; --rule-red: #e0675a; --accent: #7ea5ec; --accent-ink: #0f1724;
  --again: #e57565; --hard: #e0a945; --good: #5cbf83; --easy: #7ea5ec;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-display);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 28px; }
@media (max-width: 820px) { .app { grid-template-columns: minmax(0, 1fr); } }

header.brand { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-weight: 700; font-size: 28px; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; margin: 0; }
.logo-mark { width: 26px; height: 18px; border-radius: 2px; background: var(--surface); border: 1px solid var(--line);
  background-image: linear-gradient(var(--rule-red), var(--rule-red)), repeating-linear-gradient(to bottom, transparent 0 5px, var(--rule-blue) 5px 6px);
  background-size: 100% 1.5px, 100% 100%; background-position: 0 4px, 0 6px; background-repeat: no-repeat; transform: rotate(-6deg); }
.streak { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

/* Deck rail */
aside { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; margin: 0; }
.decks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
@media (max-width: 820px) { .decks { flex-direction: row; overflow-x: auto; padding-bottom: 4px; } .decks li { flex: 0 0 auto; } }
.deck-btn { width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 9px 12px;
  display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.deck-btn:hover { background: var(--surface); }
.deck-btn[aria-current="true"] { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); }
.deck-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.due-pill { font-family: var(--f-mono); font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--paper); color: var(--muted); border: 1px solid var(--line); flex: none; }
.due-pill.has { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.new-deck { display: flex; gap: 6px; }
.new-deck input { flex: 1; min-width: 0; }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--again); }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

/* Main */
main { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.deck-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.deck-head h2 { margin: 0; font-size: 26px; letter-spacing: -.015em; text-wrap: balance; }
.sample-tag { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; padding: 1px 6px; margin-left: 8px; vertical-align: middle; }
.tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; border-radius: 7px; padding: 6px 14px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }

/* The index card */
.stage { perspective: 1400px; }
.card { position: relative; width: 100%; max-width: 640px; aspect-ratio: 5 / 3; margin: 0 auto; border: 0; padding: 0; background: none;
  transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,.7,.2,1); display: block; }
@media (max-width: 520px) { .card { aspect-ratio: 4 / 3.4; } }
.card.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 6px; background-color: var(--surface);
  box-shadow: var(--shadow); border: 1px solid var(--line); display: flex; flex-direction: column; padding: 20px 26px 22px; overflow: hidden; }
.face.back { transform: rotateY(180deg);
  background-image: linear-gradient(to bottom, transparent 54px, var(--rule-red) 54px, var(--rule-red) 56px, transparent 56px),
    repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule-blue) 27px 28px);
  background-position: 0 0, 0 56px; background-repeat: no-repeat, repeat; }
.face-meta { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.face-body { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; font-family: var(--f-card); overflow-y: auto; min-height: 0; }
.front .face-body { font-size: clamp(24px, 4.2vw, 38px); line-height: 1.2; font-weight: 500; text-wrap: balance; }
.back .face-body { font-size: clamp(17px, 2.4vw, 22px); line-height: 28px; padding-top: 18px; }
.face-foot { font-size: 12px; color: var(--muted); text-align: center; }
kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--paper); }

.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; max-width: 640px; width: 100%; margin: 0 auto; }
.grade { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 600; }
.grade small { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); font-weight: 400; }
.grade[data-g="0"] { color: var(--again); } .grade[data-g="1"] { color: var(--hard); }
.grade[data-g="2"] { color: var(--good); } .grade[data-g="3"] { color: var(--easy); }
.grade:hover { border-color: currentColor; }
.grades[aria-disabled="true"] .grade { opacity: .4; pointer-events: none; }

.progress { max-width: 640px; width: 100%; margin: 0 auto; display: flex; align-items: center; gap: 12px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }

.done { max-width: 640px; margin: 0 auto; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 36px 24px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.done h3 { margin: 0; font-size: 22px; }
.done p { margin: 0; color: var(--muted); max-width: 46ch; }

/* Leitner tray */
.tray { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.tray-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.boxes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; align-items: end; }
.box { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.stack { height: 64px; display: flex; flex-direction: column-reverse; gap: 2px; justify-content: flex-start; }
.stack span { height: 4px; border-radius: 1px; background: var(--rule-blue); }
.stack span.lead { background: var(--accent); }
.box-label { font-family: var(--f-mono); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; border-top: 2px solid var(--ink); padding-top: 4px; font-variant-numeric: tabular-nums; }

/* Quiz */
.quiz { max-width: 640px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.quiz-q { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); padding: 22px 26px; font-family: var(--f-card); font-size: clamp(20px, 3vw, 28px); line-height: 1.25; text-align: center; text-wrap: balance; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 14px; font-family: var(--f-card); font-size: 17px; display: flex; gap: 12px; align-items: baseline; }
.choice:hover { border-color: var(--muted); }
.choice .k { font-family: var(--f-mono); font-size: 11px; color: var(--muted); flex: none; }
.choice.right { border-color: var(--good); box-shadow: inset 3px 0 0 var(--good); }
.choice.wrong { border-color: var(--again); box-shadow: inset 3px 0 0 var(--again); }
.choices[aria-disabled="true"] .choice { pointer-events: none; }
.quiz-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

/* Manage */
.manage { display: flex; flex-direction: column; gap: 18px; }
.add-form { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) auto; gap: 10px; align-items: end; }
@media (max-width: 620px) { .add-form { grid-template-columns: minmax(0,1fr); } }
.add-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.add-form textarea { resize: vertical; min-height: 42px; font-family: var(--f-card); font-size: 16px; color: var(--ink); }
details.bulk { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
details.bulk summary { cursor: pointer; font-weight: 600; }
details.bulk[open] summary { margin-bottom: 10px; }
.bulk-body { display: flex; flex-direction: column; gap: 8px; }
.bulk-body textarea { width: 100%; min-height: 110px; font-family: var(--f-mono); font-size: 13px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
td.term { font-family: var(--f-card); font-size: 16px; font-weight: 500; min-width: 140px; }
td.def { font-family: var(--f-card); font-size: 15px; color: var(--muted); min-width: 200px; }
td.boxn { font-family: var(--f-mono); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.icon-btn { border: 0; background: transparent; color: var(--muted); padding: 2px 6px; border-radius: 4px; }
.icon-btn:hover { color: var(--again); background: var(--paper); }
.danger-zone { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; z-index: 20; }

@media (prefers-reduced-motion: reduce) { .card, .bar i { transition: none; } }
</style>

<div class="app">
  <header class="brand">
    <h1 class="logo"><span class="logo-mark" aria-hidden="true"></span>Cardlit</h1>
    <span class="streak" id="streak"></span>
  </header>

  <aside>
    <p class="label">Decks</p>
    <ul class="decks" id="decks"></ul>
    <form class="new-deck" id="newDeckForm">
      <input class="field" id="newDeckName" placeholder="New deck name" aria-label="New deck name" maxlength="60">
      <button class="btn" type="submit">Add</button>
    </form>
    <p class="hint">Progress is saved in this browser only.</p>
  </aside>

  <main>
    <div class="deck-head">
      <h2 id="deckTitle"></h2>
      <div class="tabs" role="tablist" aria-label="Mode">
        <button role="tab" id="tab-study" data-mode="study" aria-selected="true">Study</button>
        <button role="tab" id="tab-quiz" data-mode="quiz" aria-selected="false">Quiz</button>
        <button role="tab" id="tab-manage" data-mode="manage" aria-selected="false">Cards</button>
      </div>
    </div>

    <section id="view-study" style="display:flex;flex-direction:column;gap:16px">
      <div class="progress" id="studyProgress"><span id="progLabel"></span><div class="bar"><i id="progBar" style="width:0"></i></div><span id="progDue"></span></div>
      <div id="studyArea"></div>
    </section>

    <section id="view-quiz" hidden></section>
    <section id="view-manage" class="manage" hidden></section>

    <section class="tray" aria-label="Leitner boxes">
      <div class="tray-head">
        <p class="label">Leitner boxes</p>
        <span class="hint">Box 1 every day · 2 every 2 days · 3 every 4 · 4 every 8 · 5 every 16</span>
      </div>
      <div class="boxes" id="boxes"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(() => {
  const DAY = 864e5;
  const INTERVALS = [1, 2, 4, 8, 16]; // days per box
  const KEY = "cardlit.v1";
  const uid = () => Math.random().toString(36).slice(2, 10);
  const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  const mk = (pairs) => pairs.map(([f, b]) => ({ id: uid(), f, b, box: 1, due: 0 }));
  const SAMPLE = [
    { id: uid(), name: "Cell Biology", sample: true, cards: mk([
      ["Mitochondrion", "Organelle that makes ATP through cellular respiration; has its own circular DNA."],
      ["Ribosome", "Reads mRNA and assembles amino acids into proteins. Free in cytoplasm or bound to rough ER."],
      ["Golgi apparatus", "Modifies, sorts and packages proteins and lipids into vesicles for transport."],
      ["Lysosome", "Membrane sac of hydrolytic enzymes (pH ≈ 4.5) that digests worn-out parts and debris."],
      ["Rough ER", "Endoplasmic reticulum studded with ribosomes; folds and processes secreted proteins."],
      ["Smooth ER", "ER without ribosomes; makes lipids and steroids, detoxifies drugs, stores Ca²⁺."],
      ["Chloroplast", "Plant organelle where photosynthesis turns light, CO₂ and water into glucose and O₂."],
      ["Nucleolus", "Dense region inside the nucleus where ribosomal RNA is made and ribosome subunits assembled."],
    ])},
    { id: uid(), name: "Spanish Verbs", sample: true, cards: mk([
      ["tener", "to have — tengo, tienes, tiene"], ["hacer", "to do / to make — hago, haces, hace"],
      ["poder", "to be able to — puedo, puedes, puede"], ["decir", "to say / to tell — digo, dices, dice"],
      ["ir", "to go — voy, vas, va"], ["saber", "to know (facts) — sé, sabes, sabe"],
      ["querer", "to want / to love — quiero, quieres, quiere"], ["salir", "to leave / to go out — salgo, sales, sale"],
    ])},
    { id: uid(), name: "World Capitals", sample: true, cards: mk([
      ["Australia", "Canberra"], ["Canada", "Ottawa"], ["Turkey", "Ankara"], ["Brazil", "Brasília"],
      ["Nigeria", "Abuja"], ["New Zealand", "Wellington"], ["Kazakhstan", "Astana"], ["Myanmar", "Naypyidaw"],
    ])},
  ];

  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || !Array.isArray(state.decks)) state = { decks: SAMPLE, current: SAMPLE[0].id, days: [] };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  let mode = "study";
  let session = null; // { queue: [cardId], done, total, flipped }
  let quiz = null;

  const deck = () => state.decks.find(d => d.id === state.current) || state.decks[0];
  const dueCards = d => d.cards.filter(c => c.due <= Date.now());
  const $ = id => document.getElementById(id);

  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 1800);
  }

  function markStudied() {
    const d = today0();
    if (!state.days.includes(d)) { state.days.push(d); state.days = state.days.slice(-400); }
  }
  function streak() {
    const set = new Set(state.days); let n = 0; let d = today0();
    if (!set.has(d)) d -= DAY;
    while (set.has(d)) { n++; d -= DAY; }
    return n;
  }

  function renderDecks() {
    $("decks").innerHTML = state.decks.map(d => {
      const due = dueCards(d).length;
      return `<li><button class="deck-btn" data-id="${d.id}" aria-current="${d.id === deck().id}">
        <span class="deck-name">${esc(d.name)}</span><span class="due-pill ${due ? "has" : ""}" title="${due} due">${due}</span></button></li>`;
    }).join("");
    const d = deck();
    $("deckTitle").innerHTML = d ? esc(d.name) + (d.sample ? '<span class="sample-tag">Sample</span>' : "") : "No decks";
    const s = streak();
    $("streak").textContent = s ? `${s}-day streak` : "Study today to start a streak";
  }

  function renderBoxes() {
    const d = deck(); const counts = [0,0,0,0,0];
    (d ? d.cards : []).forEach(c => counts[c.box - 1]++);
    const max = Math.max(12, ...counts);
    $("boxes").innerHTML = counts.map((n, i) => {
      const bars = Math.round((n / max) * 14);
      return `<div class="box"><div class="stack" aria-hidden="true">${Array.from({ length: bars }, (_, j) => `<span class="${j === bars - 1 ? "lead" : ""}"></span>`).join("")}</div>
        <div class="box-label"><span>Box ${i + 1}</span><span>${n}</span></div></div>`;
    }).join("");
  }

  /* ---------- Study ---------- */
  function startSession() {
    const d = deck();
    const q = d ? dueCards(d).sort((a, b) => a.box - b.box || a.due - b.due).map(c => c.id) : [];
    session = { queue: q, done: 0, total: q.length, flipped: false };
  }
  function renderStudy() {
    const d = deck();
    if (!session) startSession();
    const area = $("studyArea");
    const pct = session.total ? Math.round((session.done / session.total) * 100) : 0;
    $("progLabel").textContent = `${session.done} / ${session.total}`;
    $("progBar").style.width = pct + "%";
    $("progDue").textContent = `${session.queue.length} left`;
    $("studyProgress").hidden = !session.total;

    const card = d && d.cards.find(c => c.id === session.queue[0]);
    if (!card) {
      const next = d && d.cards.length ? Math.min(...d.cards.map(c => c.due)) : null;
      const when = next ? new Date(next).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }) : null;
      area.innerHTML = `<div class="done">
        <h3>${!d || !d.cards.length ? "This deck is empty" : session.total ? "Session complete" : "Nothing due right now"}</h3>
        <p>${!d || !d.cards.length ? "Add your first card on the Cards tab." :
          (session.total ? `You reviewed ${session.total} card${session.total === 1 ? "" : "s"}. ` : "") + `Next card comes due ${esc(when)}.`}</p>
        ${d && d.cards.length ? `<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
          <button class="btn primary" id="cramBtn">Review all ${d.cards.length} anyway</button>
          <button class="btn" data-goto="quiz">Take a quiz</button></div>` : `<button class="btn primary" data-goto="manage">Add cards</button>`}
      </div>`;
      return;
    }
    area.innerHTML = `
      <div class="stage"><button class="card ${session.flipped ? "flipped" : ""}" id="theCard" aria-label="Flip card">
        <div class="face front">
          <div class="face-meta"><span>${esc(d.name)}</span><span>Box ${card.box}</span></div>
          <div class="face-body">${esc(card.f)}</div>
          <div class="face-foot">Tap or press <kbd>Space</kbd> to flip</div>
        </div>
        <div class="face back">
          <div class="face-meta"><span>${esc(card.f)}</span><span>Answer</span></div>
          <div class="face-body">${esc(card.b)}</div>
        </div>
      </button></div>
      <div class="grades" id="grades" aria-disabled="${!session.flipped}" style="margin-top:16px">
        ${[["Again","Box 1"],["Hard","Stay"],["Good","+1 box"],["Easy","+2 boxes"]].map(([l, s], i) =>
          `<button class="grade" data-g="${i}">${l}<small><kbd>${i + 1}</kbd> ${s}</small></button>`).join("")}
      </div>`;
  }
  function flip() {
    if (!session || !session.queue.length) return;
    session.flipped = !session.flipped;
    $("theCard").classList.toggle("flipped", session.flipped);
    $("grades").setAttribute("aria-disabled", String(!session.flipped));
  }
  function grade(g) {
    if (!session || !session.flipped) return;
    const d = deck(); const card = d.cards.find(c => c.id === session.queue[0]);
    session.queue.shift();
    if (g === 0) { card.box = 1; card.due = 0; session.queue.splice(Math.min(3, session.queue.length), 0, card.id); }
    else {
      card.box = Math.min(5, Math.max(1, card.box + [0, 0, 1, 2][g]));
      card.due = today0() + INTERVALS[card.box - 1] * DAY;
      session.done++;
    }
    session.flipped = false;
    markStudied(); save();
    renderStudy(); renderDecks(); renderBoxes();
  }

  /* ---------- Quiz ---------- */
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function newQuiz() {
    const d = deck();
    quiz = { order: shuffle(d.cards.map(c => c.id)).slice(0, 10), i: 0, score: 0, picked: null };
  }
  function renderQuiz() {
    const v = $("view-quiz"); const d = deck();
    if (!d || d.cards.length < 4) {
      v.innerHTML = `<div class="done"><h3>Quiz needs at least 4 cards</h3><p>This deck has ${d ? d.cards.length : 0}. Add a few more on the Cards tab.</p><button class="btn primary" data-goto="manage">Add cards</button></div>`;
      return;
    }
    if (!quiz) newQuiz();
    if (quiz.i >= quiz.order.length) {
      const pct = Math.round(quiz.score / quiz.order.length * 100);
      v.innerHTML = `<div class="done"><h3>${quiz.score} of ${quiz.order.length} correct</h3>
        <p>${pct >= 90 ? "Excellent recall. These cards are ready to move up a box." : pct >= 60 ? "Solid. Run a study session to firm up the misses." : "Worth another study session before the next quiz."}</p>
        <button class="btn primary" id="retryQuiz">New quiz</button></div>`;
      return;
    }
    const card = d.cards.find(c => c.id === quiz.order[quiz.i]);
    if (!quiz.choices) {
      const others = shuffle(d.cards.filter(c => c.id !== card.id)).slice(0, 3);
      quiz.choices = shuffle([card, ...others]).map(c => ({ id: c.id, text: c.b }));
    }
    const answered = quiz.picked !== null;
    v.innerHTML = `<div class="quiz">
      <div class="quiz-q">${esc(card.f)}</div>
      <div class="choices" aria-disabled="${answered}">
        ${quiz.choices.map((c, i) => {
          const cls = answered ? (c.id === card.id ? "right" : c.id === quiz.picked ? "wrong" : "") : "";
          return `<button class="choice ${cls}" data-pick="${c.id}"><span class="k">${"ABCD"[i]}</span><span>${esc(c.text)}</span></button>`;
        }).join("")}
      </div>
      <div class="quiz-foot"><span>Question ${quiz.i + 1} of ${quiz.order.length} · Score ${quiz.score}</span>
        ${answered ? `<button class="btn primary" id="nextQ">${quiz.i + 1 === quiz.order.length ? "See results" : "Next question"} <kbd>Enter</kbd></button>` : `<span>Keys <kbd>A</kbd>–<kbd>D</kbd></span>`}</div>
    </div>`;
  }
  function pick(id) {
    if (!quiz || quiz.picked !== null) return;
    quiz.picked = id;
    if (id === quiz.order[quiz.i]) quiz.score++;
    markStudied(); save(); renderQuiz(); renderDecks();
  }
  function nextQ() { quiz.i++; quiz.picked = null; quiz.choices = null; renderQuiz(); }

  /* ---------- Manage ---------- */
  function renderManage() {
    const d = deck(); const v = $("view-manage");
    if (!d) { v.innerHTML = ""; return; }
    v.innerHTML = `
      <form class="add-form" id="addForm">
        <label for="fTerm">Front<textarea class="field" id="fTerm" rows="1" required placeholder="Term or question"></textarea></label>
        <label for="fDef">Back<textarea class="field" id="fDef" rows="1" required placeholder="Definition or answer"></textarea></label>
        <button class="btn primary" type="submit">Add card</button>
      </form>
      <details class="bulk"><summary>Paste many at once</summary>
        <div class="bulk-body">
          <p class="hint">One card per line. Separate front and back with a tab, " - ", or " : ". Works with exports from Quizlet and spreadsheets.</p>
          <textarea class="field" id="bulkText" placeholder="Photosynthesis - Turning light into chemical energy&#10;Osmosis : Water moving across a membrane"></textarea>
          <div><button class="btn" id="bulkAdd" type="button">Import cards</button></div>
        </div>
      </details>
      <div class="table-wrap"><table>
        <thead><tr><th>Front</th><th>Back</th><th>Box</th><th><span class="sr" style="position:absolute;left:-9999px">Delete</span></th></tr></thead>
        <tbody>${d.cards.length ? d.cards.map(c => `<tr><td class="term">${esc(c.f)}</td><td class="def">${esc(c.b)}</td>
          <td class="boxn">${c.box}${c.due > Date.now() ? ` · ${Math.ceil((c.due - Date.now()) / DAY)}d` : " · due"}</td>
          <td><button class="icon-btn" data-del="${c.id}" aria-label="Delete ${esc(c.f)}">✕</button></td></tr>`).join("")
          : `<tr><td colspan="4" class="hint">No cards yet. Add one above.</td></tr>`}</tbody>
      </table></div>
      <div class="danger-zone">
        <button class="btn ghost" id="resetProgress" type="button">Reset progress in this deck</button>
        <button class="btn ghost danger" id="deleteDeck" type="button">${d._confirmDel ? "Click again to delete this deck" : "Delete deck"}</button>
      </div>`;
  }

  /* ---------- Wiring ---------- */
  function setMode(m) {
    mode = m;
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.mode === m)));
    $("view-study").hidden = m !== "study"; $("view-study").style.display = m === "study" ? "flex" : "none";
    $("view-quiz").hidden = m !== "quiz"; $("view-manage").hidden = m !== "manage";
    if (m === "study") { session = null; renderStudy(); }
    if (m === "quiz") renderQuiz();
    if (m === "manage") renderManage();
  }
  function renderAll() { renderDecks(); renderBoxes(); setMode(mode); }

  document.addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.classList.contains("deck-btn")) { state.current = t.dataset.id; quiz = null; save(); renderAll(); }
    else if (t.dataset.mode) setMode(t.dataset.mode);
    else if (t.dataset.goto) setMode(t.dataset.goto);
    else if (t.id === "theCard") flip();
    else if (t.dataset.g) grade(+t.dataset.g);
    else if (t.id === "cramBtn") { const d = deck(); session = { queue: shuffle(d.cards.map(c => c.id)), done: 0, total: d.cards.length, flipped: false }; renderStudy(); }
    else if (t.dataset.pick) pick(t.dataset.pick);
    else if (t.id === "nextQ") nextQ();
    else if (t.id === "retryQuiz") { newQuiz(); renderQuiz(); }
    else if (t.dataset.del) { const d = deck(); d.cards = d.cards.filter(c => c.id !== t.dataset.del); save(); renderManage(); renderDecks(); renderBoxes(); quiz = null; toast("Card deleted"); }
    else if (t.id === "bulkAdd") {
      const lines = $("bulkText").value.split(/\n/).map(l => l.trim()).filter(Boolean);
      const add = []; lines.forEach(l => { const m = l.split(/\t| - | – | : /); if (m.length >= 2) add.push([m[0].trim(), m.slice(1).join(" - ").trim()]); });
      if (!add.length) { toast("No cards found. Use a tab, ' - ' or ' : ' between front and back."); return; }
      deck().cards.push(...mk(add)); save(); renderManage(); renderDecks(); renderBoxes(); quiz = null;
      toast(`Imported ${add.length} card${add.length === 1 ? "" : "s"}`);
    }
    else if (t.id === "resetProgress") { deck().cards.forEach(c => { c.box = 1; c.due = 0; }); save(); renderAll(); toast("Progress reset"); }
    else if (t.id === "deleteDeck") {
      const d = deck();
      if (!d._confirmDel) { d._confirmDel = true; renderManage(); setTimeout(() => { delete d._confirmDel; if (mode === "manage" && deck() === d) renderManage(); }, 3000); return; }
      state.decks = state.decks.filter(x => x.id !== d.id);
      state.current = state.decks[0] ? state.decks[0].id : null; quiz = null; save(); renderAll(); toast("Deck deleted");
    }
  });

  document.addEventListener("submit", e => {
    e.preventDefault();
    if (e.target.id === "newDeckForm") {
      const name = $("newDeckName").value.trim(); if (!name) return;
      const d = { id: uid(), name, cards: [] }; state.decks.push(d); state.current = d.id; quiz = null;
      $("newDeckName").value = ""; save(); mode = "manage"; renderAll(); $("fTerm").focus();
    }
    if (e.target.id === "addForm") {
      const f = $("fTerm").value.trim(), b = $("fDef").value.trim(); if (!f || !b) return;
      deck().cards.push(...mk([[f, b]])); save(); renderManage(); renderDecks(); renderBoxes(); quiz = null;
      $("fTerm").focus(); toast("Card added");
    }
  });

  document.addEventListener("keydown", e => {
    if (e.target.matches("input, textarea")) {
      if (e.key === "Enter" && !e.shiftKey && e.target.closest("#addForm")) { e.preventDefault(); e.target.closest("form").requestSubmit(); }
      return;
    }
    if (mode === "study") {
      if (e.key === " ") { e.preventDefault(); flip(); }
      else if (["1","2","3","4"].includes(e.key)) grade(+e.key - 1);
    } else if (mode === "quiz" && quiz) {
      const i = "abcd".indexOf(e.key.toLowerCase());
      if (i >= 0 && quiz.choices && quiz.choices[i]) pick(quiz.choices[i].id);
      else if (e.key === "Enter" && quiz.picked !== null) nextQ();
    }
  });

  renderAll();
})();
</script>
